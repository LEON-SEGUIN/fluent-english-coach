<!doctype html>
<meta charset="utf-8">
<body>
<script type="importmap">{"imports":{"three":"./vendor/package/build/three.module.js","three/addons/":"./vendor/package/examples/jsm/"}}</script>
<script type="module">
// Builds jake.glb from the Rocketbox FBX (MIT): smooth normals, split by material, only the morphs and clips the app uses.
import * as THREE from "three";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { TGALoader } from "three/addons/loaders/TGALoader.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

const NAME = "Male_Adult_08", PRE = "m014", base = `./models/${NAME}/`;
const log = (...a) => console.log(...a);

const KEEP_MORPHS = {
  AA_VI_01_PP: "v_PP", AA_VI_02_FF: "v_FF", AA_VI_03_TH: "v_TH", AA_VI_04_DD: "v_DD", AA_VI_05_KK: "v_KK", AA_VI_06_CH: "v_CH", AA_VI_07_SS: "v_SS",
  AA_VI_08_nn: "v_nn", AA_VI_09_RR: "v_RR", AA_VI_10_aa: "v_aa", AA_VI_11_E: "v_E", AA_VI_12_I: "v_I", AA_VI_13_O: "v_O", AA_VI_14_U: "v_U",
  AK_01_BrowDownLeft: "browDownL", AK_02_BrowDownRight: "browDownR", AK_03_BrowInnerUp: "browInnerUp", AK_04_BrowOuterUpLeft: "browOuterL", AK_05_BrowOuterUpRight: "browOuterR",
  AK_07_CheekSquintLeft: "cheekL", AK_08_CheekSquintRight: "cheekR", AK_09_EyeBlinkLeft: "blinkL", AK_10_EyeBlinkRight: "blinkR",
  AK_19_EyeSquintLeft: "squintL", AK_20_EyeSquintRight: "squintR", AK_21_EyeWideLeft: "wideL", AK_22_EyeWideRight: "wideR",
  AK_25_JawOpen: "jawOpen", AK_28_MouthDimpleLeft: "dimpleL", AK_29_MouthDimpleRight: "dimpleR", AK_30_MouthFrownLeft: "frownL", AK_31_MouthFrownRight: "frownR",
  AK_32_MouthFunnel: "funnel", AK_33_MouthLeft: "mouthL", AK_36_MouthPressLeft: "pressL", AK_37_MouthPressRight: "pressR", AK_38_MouthPucker: "pucker", AK_39_MouthRight: "mouthR",
  AK_44_MouthSmileLeft: "smileL", AK_45_MouthSmileRight: "smileR", AK_50_NoseSneerLeft: "sneerL", AK_51_NoseSneerRight: "sneerR",
  // For a mouth you can learn from: the tongue, the lips that roll in or lift, and small signs of life.
  AK_52_TongueOut: "tongueOut", AK_40_MouthRollLower: "rollLower", AK_41_MouthRollUpper: "rollUpper",
  AK_34_MouthLowerDownLeft: "lowerDownL", AK_35_MouthLowerDownRight: "lowerDownR", AK_48_MouthUpperUpLeft: "upperUpL", AK_49_MouthUpperUpRight: "upperUpR",
  AK_46_MouthStretchLeft: "stretchL", AK_47_MouthStretchRight: "stretchR", AK_42_MouthShrugLower: "shrugLower", AK_43_MouthShrugUpper: "shrugUpper",
  AU_25_LipsPart: "lipsPart", AU_41_LidDroop: "lidDroop",
};
// The face is driven by morphs and by the code; the legs are out of the shot.
const DROP_BONE = /(Eye|Jaw|Lip|Mouth|Tongue|Masseter|Caninus|Cheek|Brow|Nose|Thigh|Calf|Foot|Toe)/;

const manager = new THREE.LoadingManager();
manager.addHandler(/\.tga$/i, new TGALoader(manager));
manager.setURLModifier((u) => { const f = decodeURIComponent(u.split(/[\\/]/).pop()); return /\.tga$/i.test(f) ? base + f : u; });

function canvasFrom(img, size, keepAlpha) {
  const src = document.createElement("canvas");
  src.width = img.width; src.height = img.height;
  const ctx = src.getContext("2d");
  const data = ctx.createImageData(img.width, img.height);
  data.data.set(img.data);
  if (!keepAlpha) for (let i = 3; i < data.data.length; i += 4) data.data[i] = 255;
  ctx.putImageData(data, 0, 0);
  const out = document.createElement("canvas");
  out.width = out.height = size;
  const c2 = out.getContext("2d");
  c2.imageSmoothingQuality = "high";
  c2.drawImage(src, 0, 0, size, size);
  return out;
}
const tga = new TGALoader();
async function tex(file, size, { alpha = false, srgb = true } = {}) {
  const t = await tga.loadAsync(base + file);
  await new Promise((r) => setTimeout(r, 0));
  const c = canvasFrom(t.image, size, alpha);
  const out = new THREE.CanvasTexture(c);
  out.flipY = t.flipY;
  out.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  out.userData.mimeType = alpha ? "image/png" : "image/jpeg";
  out.name = file;
  return out;
}

// Shiny where the specular map is bright. Stored in green (glTF's roughness); blue (metalness) stays 0.
async function roughTex(file, size, fn, paint) {
  const t = await tga.loadAsync(base + file);
  await new Promise((r) => setTimeout(r, 0));
  const c = canvasFrom(t.image, size, false);
  const ctx = c.getContext("2d");
  const im = ctx.getImageData(0, 0, size, size);
  for (let i = 0; i < im.data.length; i += 4) { const v = fn(im.data[i] / 255); im.data[i] = 0; im.data[i + 1] = Math.round(255 * Math.max(0.04, Math.min(1, v))); im.data[i + 2] = 0; }
  ctx.putImageData(im, 0, 0);
  paint?.(ctx, size);
  const out = new THREE.CanvasTexture(c);
  out.flipY = t.flipY;
  out.colorSpace = THREE.NoColorSpace;
  out.userData.mimeType = "image/jpeg";
  out.name = file.replace("specular", "rough");
  return out;
}
// The eye in the head texture: the bright, grey patch in the corner. It becomes wet and mirror-like.
async function findEye() {
  const t = await tga.loadAsync(`${base}${PRE}_head_color.tga`);
  const { width: W, height: H, data } = t.image;
  let n = 0, sx = 0, sy = 0, sxx = 0, syy = 0;
  for (let y = 0; y < H; y++) {
    const fy = y / H;
    if (fy > 0.2 && fy < 0.8) continue; // only near the top or bottom edge of the picture
    for (let x = Math.floor(W * 0.15); x < W * 0.4; x++) {
      const i = (y * W + x) * 4, r = data[i], g = data[i + 1], b = data[i + 2];
      if (r > 175 && g > 175 && b > 170 && Math.abs(r - b) < 45) { n++; sx += x; sy += y; sxx += x * x; syy += y * y; }
    }
  }
  const cx = sx / n / W, cy = sy / n / H;
  const rx = 2 * Math.sqrt(sxx / n - (sx / n) ** 2) / W, ry = 2 * Math.sqrt(syy / n - (sy / n) ** 2) / H;
  log("eye patch", n, "centre", cx.toFixed(3), cy.toFixed(3), "radius", rx.toFixed(3), ry.toFixed(3));
  return { cx, cy, rx, ry };
}

const fbx = await new FBXLoader(manager).loadAsync(`${base}${NAME}.fbx`);
const source = fbx.getObjectByProperty("isSkinnedMesh", true);
const g = source.geometry;
log("source", g.attributes.position.count, "corners, indexed:", !!g.index, "groups:", JSON.stringify(g.groups), "relative morphs:", g.morphTargetsRelative, "morph normals:", !!g.morphAttributes.normal);

// Smooth normals by position: the file's normals give blocks of dark and light on the shirt.
{
  const pos = g.attributes.position, nor = g.attributes.normal;
  const key = (i) => `${Math.round(pos.getX(i) * 50)},${Math.round(pos.getY(i) * 50)},${Math.round(pos.getZ(i) * 50)}`;
  const sum = new Map();
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), n = new THREE.Vector3();
  const ids = new Array(pos.count);
  for (let i = 0; i < pos.count; i += 3) {
    a.fromBufferAttribute(pos, i); b.fromBufferAttribute(pos, i + 1); c.fromBufferAttribute(pos, i + 2);
    n.copy(b).sub(a).cross(c.clone().sub(a)); // area-weighted face normal
    for (let k = 0; k < 3; k++) {
      const id = key(i + k);
      ids[i + k] = id;
      if (!sum.has(id)) sum.set(id, new THREE.Vector3());
      sum.get(id).add(n);
    }
  }
  for (const v of sum.values()) v.normalize();
  for (let i = 0; i < pos.count; i++) { const v = sum.get(ids[i]); nor.setXYZ(i, v.x, v.y, v.z); }
}

const eye = await findEye();
const headRough = await roughTex(`${PRE}_head_specular.tga`, 1024, (s) => 0.8 - s * 0.62, (ctx, size) => {
  ctx.save();
  ctx.translate(eye.cx * size, eye.cy * size);
  ctx.scale(eye.rx * size * 1.45, eye.ry * size * 1.7);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, "rgb(0,20,0)"); g.addColorStop(0.8, "rgb(0,26,0)"); g.addColorStop(1, "rgba(0,26,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(-1, -1, 2, 2);
  ctx.restore();
});
const bodyRough = await roughTex(`${PRE}_body_specular.tga`, 1024, (s) => 0.92 - s * 0.7);
const mats = {
  body: new THREE.MeshStandardMaterial({ name: "body", map: await tex(`${PRE}_body_color.tga`, 1024), normalMap: await tex(`${PRE}_body_normal.tga`, 1024, { srgb: false }), roughnessMap: bodyRough, metalnessMap: bodyRough, roughness: 1, metalness: 0 }),
  head: new THREE.MeshStandardMaterial({ name: "head", map: await tex(`${PRE}_head_color.tga`, 2048), normalMap: await tex(`${PRE}_head_normal.tga`, 2048, { srgb: false }), roughnessMap: headRough, metalnessMap: headRough, roughness: 1, metalness: 0 }),
  opacity: new THREE.MeshStandardMaterial({ name: "opacity", map: await tex(`${PRE}_opacity_color.tga`, 1024, { alpha: true }), roughness: 0.7, metalness: 0, transparent: true, alphaTest: 0.25, side: THREE.DoubleSide }),
};
const srcMats = Array.isArray(source.material) ? source.material : [source.material];
const whichMat = (m) => (/head/i.test(m.name) ? "head" : /opacity/i.test(m.name) ? "opacity" : "body");

// One mesh per material. Only the parts a morph really moves keep the morphs.
const dict = source.morphTargetDictionary;
const report = [];
const meshes = [];
for (const group of g.groups.length ? g.groups : [{ start: 0, count: g.attributes.position.count, materialIndex: 0 }]) {
  const kind = whichMat(srcMats[group.materialIndex]);
  const geo = new THREE.BufferGeometry();
  const take = (attr) => new THREE.BufferAttribute(attr.array.slice(group.start * attr.itemSize, (group.start + group.count) * attr.itemSize), attr.itemSize, attr.normalized);
  for (const name of ["position", "normal", "uv", "skinIndex", "skinWeight"]) geo.setAttribute(name, take(g.attributes[name]));
  let maxDelta = 0;
  const names = [];
  const morphs = [];
  for (const [full, idx] of Object.entries(dict)) {
    const short = KEEP_MORPHS[full.replace(/^.*\./, "")];
    if (!short) continue;
    const attr = take(g.morphAttributes.position[idx]);
    for (let i = 0; i < attr.array.length; i++) maxDelta = Math.max(maxDelta, Math.abs(attr.array[i]));
    morphs.push(attr);
    names.push(short);
  }
  const hasMorphs = maxDelta > 0.02;
  if (hasMorphs) { geo.morphAttributes.position = morphs; geo.morphTargetsRelative = true; }
  const merged = mergeVertices(geo, 1e-3);
  report.push({ kind, corners: group.count, verts: merged.attributes.position.count, maxDelta: +maxDelta.toFixed(2), morphs: hasMorphs ? names.length : 0 });
  const mesh = new THREE.SkinnedMesh(merged, mats[kind]);
  mesh.name = `jake_${kind}`;
  if (hasMorphs) {
    mesh.morphTargetDictionary = Object.fromEntries(names.map((n, i) => [n, i]));
    mesh.morphTargetInfluences = names.map(() => 0);
  }
  meshes.push({ mesh, kind });
}
log("meshes", JSON.stringify(report));

const root = new THREE.Group();
root.name = "jake";
const hips = fbx.getObjectByName("Bip01");
root.add(hips);
for (const { mesh } of meshes) {
  mesh.bind(source.skeleton, source.bindMatrix);
  root.add(mesh);
}
const bones = new Set(source.skeleton.bones.map((b) => b.name));

// ---------- The clips ----------
const quatAngle = (q, x, y, z, w) => 2 * Math.acos(Math.min(1, Math.abs(q.x * x + q.y * y + q.z * z + q.w * w)));
const a = new THREE.Quaternion(), b = new THREE.Quaternion(), s = new THREE.Quaternion();
function thinQuat(track, tol) {
  const t = track.times, v = track.values, keep = [0];
  let last = 0;
  for (let i = 1; i < t.length - 1; i++) {
    // Can every key since the last kept one be rebuilt from last and i + 1?
    let ok = true;
    a.fromArray(v, last * 4); b.fromArray(v, (i + 1) * 4);
    for (let k = last + 1; k <= i && ok; k++) {
      s.slerpQuaternions(a, b, (t[k] - t[last]) / (t[i + 1] - t[last]));
      if (quatAngle(s, v[k * 4], v[k * 4 + 1], v[k * 4 + 2], v[k * 4 + 3]) > tol) ok = false;
    }
    if (!ok) { keep.push(i); last = i; }
  }
  keep.push(t.length - 1);
  const times = new Float32Array(keep.length), values = new Float32Array(keep.length * 4);
  keep.forEach((k, n) => { times[n] = t[k]; for (let j = 0; j < 4; j++) values[n * 4 + j] = v[k * 4 + j]; });
  return new THREE.QuaternionKeyframeTrack(track.name, times, values);
}
function thinVec(track, tol) {
  const t = track.times, v = track.values, keep = [0];
  let last = 0;
  for (let i = 1; i < t.length - 1; i++) {
    let ok = true;
    for (let k = last + 1; k <= i && ok; k++) {
      const f = (t[k] - t[last]) / (t[i + 1] - t[last]);
      for (let j = 0; j < 3; j++) if (Math.abs(v[last * 3 + j] + (v[(i + 1) * 3 + j] - v[last * 3 + j]) * f - v[k * 3 + j]) > tol) ok = false;
    }
    if (!ok) { keep.push(i); last = i; }
  }
  keep.push(t.length - 1);
  const times = new Float32Array(keep.length), values = new Float32Array(keep.length * 3);
  keep.forEach((k, n) => { times[n] = t[k]; for (let j = 0; j < 3; j++) values[n * 3 + j] = v[k * 3 + j]; });
  return new THREE.VectorKeyframeTrack(track.name, times, values);
}

const wanted = (await (await fetch("./clips/wanted.txt")).text()).split("\n").map((x) => x.trim()).filter(Boolean);
const clips = [];
const clipReport = [];
for (const name of wanted) {
  const anim = await new FBXLoader().loadAsync(`./clips/${name}.fbx`);
  const clip = anim.animations[0];
  if (!clip) { log("no clip in", name); continue; }
  const tracks = [];
  let before = 0;
  for (const tr of clip.tracks) {
    before += tr.times.length;
    const [bone, prop] = tr.name.split(".");
    if (!bones.has(bone) || DROP_BONE.test(bone)) continue;
    if (prop === "quaternion") {
      // Fingers and small bones may stray a little more.
      const tol = /Finger/.test(bone) ? 0.03 : 0.006;
      const t2 = thinQuat(tr, tol);
      if (t2.times.length > 2 || quatAngle(a.fromArray(t2.values, 0), t2.values[4], t2.values[5], t2.values[6], t2.values[7]) > 0.002) tracks.push(t2);
      else tracks.push(new THREE.QuaternionKeyframeTrack(tr.name, [0], Array.from(t2.values.slice(0, 4))));
    } else if (prop === "position" && /^Bip01$|Pelvis$/.test(bone)) tracks.push(thinVec(tr, 0.05));
  }
  const dur = Math.min(clip.duration, 16);
  const out = new THREE.AnimationClip(name.replace(/^m_/, ""), clip.duration, tracks);
  if (clip.duration > 16) out.trim?.();
  const keys = tracks.reduce((n, t) => n + t.times.length, 0);
  clipReport.push(`${name.replace(/^m_/, "")} ${clip.duration.toFixed(1)}s ${tracks.length}tr ${before}->${keys}`);
  clips.push(out);
}
log(clipReport.join("\n"));

const scene = new THREE.Scene();
scene.add(root);
scene.updateMatrixWorld(true);
const glb = await new GLTFExporter().parseAsync(scene, { binary: true, animations: clips, onlyVisible: false, maxTextureSize: 2048 });
log("glb bytes", glb.byteLength);
await fetch("/save/jake.glb", { method: "POST", body: glb });
window.__result = { glb: glb.byteLength, clips: clips.length };
window.__ready = true;
</script>
